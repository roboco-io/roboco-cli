<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="620" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">ROBOCO CLI — Multi-Layer Verification Harness</text>
  <text x="400" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Enterprise-grade guardrails for full vibe coding</text>

  <!-- Layer 1: Developer Intent -->
  <rect x="40" y="85" width="720" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="85" width="720" height="4" rx="2" fill="url(#accent)"/>
  <text x="60" y="110" fill="#c4b5fd" font-size="13" font-weight="600">Layer 1 · Developer Intent</text>
  <text x="60" y="130" fill="#94a3b8" font-size="11">AI Interview → Requirements → Research → Plan → Implement (5-stage vibe coding process)</text>
  <text x="680" y="118" fill="#6366f1" font-size="20" text-anchor="end" filter="url(#glow)">💬</text>

  <!-- Arrow -->
  <path d="M400 145 L400 160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>

  <!-- Layer 2: AI Code Generation -->
  <rect x="40" y="165" width="720" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="165" width="720" height="4" rx="2" fill="#22d3ee"/>
  <text x="60" y="190" fill="#67e8f9" font-size="13" font-weight="600">Layer 2 · AI Code Generation</text>
  <text x="60" y="210" fill="#94a3b8" font-size="11">Claude Code + OMC Agents + Harness Agent Teams → CLAUDE.md context → Stack-specific hooks</text>
  <text x="680" y="198" fill="#22d3ee" font-size="20" text-anchor="end" filter="url(#glow)">🤖</text>

  <!-- Arrow -->
  <path d="M400 225 L400 240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Pre-commit -->
  <rect x="40" y="245" width="345" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="245" width="345" height="4" rx="2" fill="#facc15"/>
  <text x="60" y="272" fill="#fde68a" font-size="13" font-weight="600">Layer 3a · Pre-commit (local)</text>
  <text x="60" y="290" fill="#94a3b8" font-size="11">lint-staged → ESLint --fix</text>
  <text x="60" y="304" fill="#94a3b8" font-size="11">Prettier auto-format</text>

  <rect x="415" y="245" width="345" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="415" y="245" width="345" height="4" rx="2" fill="#fb923c"/>
  <text x="435" y="272" fill="#fdba74" font-size="13" font-weight="600">Layer 3b · Pre-push (local)</text>
  <text x="435" y="290" fill="#94a3b8" font-size="11">TypeCheck → Unit/Integration Tests</text>
  <text x="435" y="304" fill="#94a3b8" font-size="11">AI Code Review (Claude Agent SDK)</text>

  <!-- Arrow -->
  <path d="M400 315 L400 335" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: CI Pipeline -->
  <rect x="40" y="340" width="720" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="340" width="720" height="4" rx="2" fill="#4ade80"/>
  <text x="60" y="367" fill="#86efac" font-size="13" font-weight="600">Layer 4 · CI Pipeline (GitHub Actions)</text>

  <!-- CI boxes -->
  <rect x="60" y="378" width="95" height="32" rx="4" fill="#1a2332" stroke="#4ade80" stroke-width="1"/>
  <text x="107" y="398" text-anchor="middle" fill="#86efac" font-size="10">Lint</text>

  <rect x="170" y="378" width="95" height="32" rx="4" fill="#1a2332" stroke="#4ade80" stroke-width="1"/>
  <text x="217" y="398" text-anchor="middle" fill="#86efac" font-size="10">TypeCheck</text>

  <rect x="280" y="378" width="95" height="32" rx="4" fill="#1a2332" stroke="#4ade80" stroke-width="1"/>
  <text x="327" y="398" text-anchor="middle" fill="#86efac" font-size="10">Unit Tests</text>

  <rect x="390" y="378" width="95" height="32" rx="4" fill="#1a2332" stroke="#4ade80" stroke-width="1"/>
  <text x="437" y="398" text-anchor="middle" fill="#86efac" font-size="10">Integration</text>

  <rect x="500" y="378" width="95" height="32" rx="4" fill="#1a2332" stroke="#4ade80" stroke-width="1"/>
  <text x="547" y="398" text-anchor="middle" fill="#86efac" font-size="10">E2E Tests</text>

  <rect x="610" y="378" width="130" height="32" rx="4" fill="#1a2332" stroke="#4ade80" stroke-width="1"/>
  <text x="675" y="398" text-anchor="middle" fill="#86efac" font-size="10">Build + Smoke</text>

  <!-- Arrow -->
  <path d="M400 425 L400 445" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 5: Release -->
  <rect x="40" y="450" width="345" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="450" width="345" height="4" rx="2" fill="#f472b6"/>
  <text x="60" y="477" fill="#f9a8d4" font-size="13" font-weight="600">Layer 5 · Release Gate</text>
  <text x="60" y="495" fill="#94a3b8" font-size="11">Tag → Validate → npm publish → GitHub Release</text>

  <rect x="415" y="450" width="345" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="415" y="450" width="345" height="4" rx="2" fill="#38bdf8"/>
  <text x="435" y="477" fill="#7dd3fc" font-size="13" font-weight="600">Layer 6 · Repo Hygiene</text>
  <text x="435" y="495" fill="#94a3b8" font-size="11">Issue auto-label → Stale management → Drift detection</text>

  <!-- Arrow -->
  <path d="M400 510 L400 530" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 7: Audit -->
  <rect x="40" y="535" width="720" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="535" width="720" height="4" rx="2" fill="#a78bfa"/>
  <text x="60" y="562" fill="#c4b5fd" font-size="13" font-weight="600">Layer 7 · Maturity Audit</text>
  <text x="60" y="580" fill="#94a3b8" font-size="11">roboco audit → Claude Env (30pts) + Process (20pts) + Quality Gates (20pts) + Tools (15pts) + Team (15pts) = 100</text>
  <text x="680" y="568" fill="#a78bfa" font-size="20" text-anchor="end" filter="url(#glow)">📊</text>

  <!-- Legend -->
  <text x="740" y="612" text-anchor="end" fill="#475569" font-size="9">ROBOCO CLI v0.4 · roboco.io</text>
</svg>
