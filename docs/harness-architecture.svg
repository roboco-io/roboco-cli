<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="580" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">ROBOCO CLI — Multi-Layer Verification Harness</text>
  <text x="400" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Enterprise-grade guardrails for full vibe coding</text>

  <!-- Layer 1: Developer Intent -->
  <rect x="40" y="80" width="720" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="80" width="720" height="4" rx="2" fill="url(#accent)"/>
  <text x="60" y="103" fill="#c4b5fd" font-size="13" font-weight="600">Layer 1 · Developer Intent</text>
  <text x="60" y="121" fill="#94a3b8" font-size="11">AI Interview → Requirements → Research → Plan → Implement (5-stage vibe coding process)</text>
  <text x="720" y="110" fill="#6366f1" font-size="18" text-anchor="end" filter="url(#glow)">💬</text>

  <!-- Layer 2: AI Code Generation -->
  <rect x="40" y="145" width="720" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="145" width="720" height="4" rx="2" fill="#22d3ee"/>
  <text x="60" y="168" fill="#67e8f9" font-size="13" font-weight="600">Layer 2 · AI Code Generation</text>
  <text x="60" y="186" fill="#94a3b8" font-size="11">Claude Code + OMC Agents + Harness Agent Teams · CLAUDE.md context · Stack-specific hooks</text>
  <text x="720" y="175" fill="#22d3ee" font-size="18" text-anchor="end" filter="url(#glow)">🤖</text>

  <!-- Layer 3: Pre-commit + Pre-push -->
  <rect x="40" y="210" width="345" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="210" width="345" height="4" rx="2" fill="#facc15"/>
  <text x="60" y="234" fill="#fde68a" font-size="13" font-weight="600">Layer 3a · Pre-commit (local)</text>
  <text x="60" y="252" fill="#94a3b8" font-size="11">lint-staged · ESLint --fix · Prettier auto-format</text>

  <rect x="415" y="210" width="345" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="415" y="210" width="345" height="4" rx="2" fill="#fb923c"/>
  <text x="435" y="234" fill="#fdba74" font-size="13" font-weight="600">Layer 3b · Pre-push (local)</text>
  <text x="435" y="252" fill="#94a3b8" font-size="11">TypeCheck · Tests · AI Code Review (Agent SDK)</text>

  <!-- Layer 4: CI Pipeline -->
  <rect x="40" y="285" width="720" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="285" width="720" height="4" rx="2" fill="#4ade80"/>
  <text x="60" y="310" fill="#86efac" font-size="13" font-weight="600">Layer 4 · CI Pipeline (GitHub Actions)</text>

  <rect x="60" y="322" width="95" height="30" rx="4" fill="#1a2332" stroke="#4ade80" stroke-width="1"/>
  <text x="107" y="341" text-anchor="middle" fill="#86efac" font-size="10">Lint</text>

  <rect x="170" y="322" width="95" height="30" rx="4" fill="#1a2332" stroke="#4ade80" stroke-width="1"/>
  <text x="217" y="341" text-anchor="middle" fill="#86efac" font-size="10">TypeCheck</text>

  <rect x="280" y="322" width="95" height="30" rx="4" fill="#1a2332" stroke="#4ade80" stroke-width="1"/>
  <text x="327" y="341" text-anchor="middle" fill="#86efac" font-size="10">Unit Tests</text>

  <rect x="390" y="322" width="95" height="30" rx="4" fill="#1a2332" stroke="#4ade80" stroke-width="1"/>
  <text x="437" y="341" text-anchor="middle" fill="#86efac" font-size="10">Integration</text>

  <rect x="500" y="322" width="95" height="30" rx="4" fill="#1a2332" stroke="#4ade80" stroke-width="1"/>
  <text x="547" y="341" text-anchor="middle" fill="#86efac" font-size="10">E2E Tests</text>

  <rect x="610" y="322" width="130" height="30" rx="4" fill="#1a2332" stroke="#4ade80" stroke-width="1"/>
  <text x="675" y="341" text-anchor="middle" fill="#86efac" font-size="10">Build + Smoke</text>

  <!-- Layer 5 + 6 -->
  <rect x="40" y="375" width="345" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="375" width="345" height="4" rx="2" fill="#f472b6"/>
  <text x="60" y="399" fill="#f9a8d4" font-size="13" font-weight="600">Layer 5 · Release Gate</text>
  <text x="60" y="417" fill="#94a3b8" font-size="11">Tag · Validate · npm publish · GitHub Release</text>

  <rect x="415" y="375" width="345" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="415" y="375" width="345" height="4" rx="2" fill="#38bdf8"/>
  <text x="435" y="399" fill="#7dd3fc" font-size="13" font-weight="600">Layer 6 · Repo Hygiene</text>
  <text x="435" y="417" fill="#94a3b8" font-size="11">Issue auto-label · Stale management · Drift detection</text>

  <!-- Layer 7: Audit -->
  <rect x="40" y="440" width="720" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="440" width="720" height="4" rx="2" fill="#a78bfa"/>
  <text x="60" y="463" fill="#c4b5fd" font-size="13" font-weight="600">Layer 7 · Maturity Audit</text>
  <text x="60" y="481" fill="#94a3b8" font-size="11">roboco audit · Claude Env (30pts) + Process (20pts) + Quality Gates (20pts) + Tools (15pts) + Team (15pts) = 100</text>
  <text x="720" y="470" fill="#a78bfa" font-size="18" text-anchor="end" filter="url(#glow)">📊</text>

  <!-- Footer -->
  <text x="400" y="520" text-anchor="middle" fill="#334155" font-size="10">Every layer is auto-configured by  npx roboco init  · No manual setup required</text>
  <text x="740" y="570" text-anchor="end" fill="#475569" font-size="9">ROBOCO CLI v0.4 · roboco.io</text>
</svg>
